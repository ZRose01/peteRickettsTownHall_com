<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How many days has it been since Pete Ricketts held a town hall?</title>

  <!-- Nothing in the head carries the day count. The script has the clock
       and rewrites document.title on load, but this is what a crawler
       stores and what every link preview shows, and a number baked in here
       is wrong by the next morning — it read 459 for weeks while the count
       was past 470. Everything static is written to stay true: the anchor
       date doesn't move, and neither does the question.

       The question is the phrasing people actually type — "how many days
       since Pete Ricketts held a town hall" — so it leads the title and
       every description, and the page answers it in the first thing you
       see. It is a question rather than a count, which is what lets it sit
       in a cached <title> and still be true tomorrow. Note that it is the
       only place the wording relaxes: everywhere the page makes the claim
       it says in-person, because Ricketts has held tele-town halls since. -->
  <meta name="description" content="How many days has it been since Pete Ricketts held a town hall? He has not held an in-person town hall in Nebraska since April 25, 2025, in Scottsbluff.">

  <link rel="canonical" href="https://peterickettstownhall.com/">

  <meta property="og:title" content="How many days has it been since Pete Ricketts held a town hall?">
  <meta property="og:description" content="How many days has it been since Pete Ricketts held a town hall? He has not held an in-person town hall in Nebraska since April 25, 2025, in Scottsbluff.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://peterickettstownhall.com/">
  <meta property="og:site_name" content="peteRickettsTownHall.com">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://peterickettstownhall.com/assets/share.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="How long since Pete Ricketts held an in-person town hall?">

  <!-- summary_large_image is what turns a shared link into the full-width
       card rather than a thumbnail beside the text. -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="How many days has it been since Pete Ricketts held a town hall?">
  <meta name="twitter:description" content="How many days has it been since Pete Ricketts held a town hall? He has not held an in-person town hall in Nebraska since April 25, 2025, in Scottsbluff.">
  <meta name="twitter:image" content="https://peterickettstownhall.com/assets/share.png">
  <meta name="twitter:image:alt" content="How long since Pete Ricketts held an in-person town hall?">

  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#000000">

  <!-- A clock, because the page is a stopwatch. Red field with a white
       ring and two hands, drawn to be read at 16 pixels: on a 64 box the
       ring is a 6-unit stroke and the hands a 5, set at 12 and 4, and
       there is nothing else in the square — no tick marks, no numerals,
       nothing that turns to mush at that size. The hands are a lighter
       stroke than the ring on purpose: at the same weight the wedge
       between them closes up and the dial reads as a solid blob.

       Red rather than the page's black, because a favicon sits on the
       browser's own tab strip and a black square is invisible on a dark
       one. The red is the accent already on the page.

       Static, and inline as a data URI rather than a file: the page is
       meant to open from file:// with nothing beside it, and this also
       stops the browser reaching for a /favicon.ico that isn't there. An
       earlier version drew the day count here at load, which is why the
       icon had to be painted rather than shipped — a favicon is cached
       harder than anything else on a page, so a number on it would have
       been a day stale by morning. A clock doesn't move, so it ships. -->
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23b81f2e'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23ffffff' stroke-width='6'/%3E%3Cg stroke='%23ffffff' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M32 32V17'/%3E%3Cpath d='M32 32l8 4'/%3E%3C/g%3E%3C/svg%3E">

  <!-- The one fact the page rests on, in a form a machine can read. Kept
       to what the page actually asserts and can stand behind: the date, the
       place, and that the count is measured from it.

       Written as an @graph of four nodes with @ids rather than one nested
       WebSite, so each thing is named once and referred to afterwards, and
       so the page itself is a node — the WebSite is the site, the WebPage
       is what a search result actually points at.

       `sameAs` on Ricketts is the part that earns its keep. "Pete Ricketts"
       on its own is a string; the Wikidata item, the Wikipedia article and
       the Senate office page are what tell a search engine which entity
       this page is about, which is the difference between ranking for the
       senator and ranking for a surname. Q6106781 is his item — checked
       against the Wikipedia article's own wikibase link, not guessed.

       Nothing here carries the day count, for the same reason nothing else
       in the head does. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://peterickettstownhall.com/#website",
        "name": "peteRickettsTownHall.com",
        "url": "https://peterickettstownhall.com/",
        "inLanguage": "en-US",
        "description": "How many days has it been since Pete Ricketts held a town hall? A running count of the days since Senator Pete Ricketts last held an in-person town hall in Nebraska.",
        "publisher": { "@id": "https://osbornforsenate.com/#organization" }
      },
      {
        "@type": "WebPage",
        "@id": "https://peterickettstownhall.com/#webpage",
        "url": "https://peterickettstownhall.com/",
        "name": "How many days has it been since Pete Ricketts held a town hall?",
        "description": "How many days has it been since Pete Ricketts held a town hall? He has not held an in-person town hall in Nebraska since April 25, 2025, in Scottsbluff.",
        "inLanguage": "en-US",
        "isPartOf": { "@id": "https://peterickettstownhall.com/#website" },
        "about": { "@id": "https://www.wikidata.org/wiki/Q6106781" },
        "primaryImageOfPage": {
          "@type": "ImageObject",
          "url": "https://peterickettstownhall.com/assets/share.png",
          "width": 1200,
          "height": 630
        }
      },
      {
        "@type": "Person",
        "@id": "https://www.wikidata.org/wiki/Q6106781",
        "name": "Pete Ricketts",
        "givenName": "Pete",
        "familyName": "Ricketts",
        "jobTitle": "United States Senator",
        "description": "United States Senator for Nebraska",
        "url": "https://www.ricketts.senate.gov/",
        "sameAs": [
          "https://en.wikipedia.org/wiki/Pete_Ricketts",
          "https://www.wikidata.org/wiki/Q6106781",
          "https://www.ricketts.senate.gov/"
        ],
        "affiliation": {
          "@type": "GovernmentOrganization",
          "name": "United States Senate",
          "sameAs": "https://en.wikipedia.org/wiki/United_States_Senate"
        },
        "workLocation": {
          "@type": "AdministrativeArea",
          "name": "Nebraska",
          "sameAs": "https://en.wikipedia.org/wiki/Nebraska"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://osbornforsenate.com/#organization",
        "name": "Osborn for Senate",
        "url": "https://osbornforsenate.com"
      }
    ]
  }
  </script>

  <style>
    /* The page is black end to end. The type stacks are the O4S brand
       faces, declared here in full: they used to be repeated from the map
       component's stylesheet, whose own copies were scoped to
       .nebraska-map and deliberately didn't leak into a host page, and
       with the map gone this is the only declaration of them. On
       osbornforsenate.com they resolve through the site's Typekit; off
       that domain (here) the fallbacks stand in, which is why each stack
       ends in a condensed or humanist system face rather than bare
       sans-serif. */
    :root {
      --black: #000000;
      --red: #b81f2e;
      --dim: #8f8f8f;

      --font-heading: "alternate-gothic-compressed-atf", "Oswald",
                      "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
      --font-label: "industry", "Roboto Condensed", "Arial Narrow", sans-serif;
      --font-body: "din-2014", "Helvetica Neue", Arial, sans-serif;

      /* One content column for every section, matching the host site's
         own: min(1200px, 92vw), tightening to 88vw below its 749px
         breakpoint. */
      --col: min(1200px, 92vw);
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    /* Only the horizontal axis is clipped. There is nothing to either
       side to reach, so a sideways scrollbar would only ever mean
       something has overrun — but the attribution deliberately sits below
       the fold, and clipping the vertical would put it out of reach. */
    html, body { overflow-x: hidden; }

    body {
      margin: 0;
      background: var(--black);
      color: #ffffff;
      font-family: var(--font-body);
      /* The counter is the loudest thing on the page; nothing else
         should compete, so body copy stays quiet and generously led. */
      line-height: 1.5;
    }

    /* ---- The fold ---------------------------------------------------
       The count fills the window on its own and the attribution begins
       underneath it, so the first screen is the number and nothing else.
       Everything in here is sized off the HEIGHT — the type is as large as
       a window can carry rather than as large as it is wide.

       dvh ahead of vh where it is understood: on mobile Safari and Chrome
       100vh is the viewport with the URL bar RETRACTED, so a block sized
       to it stands taller than the window it is in, and the fold lands
       above the bottom of the screen by exactly the height of that bar.
       dvh is the window as it actually is. */
    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      width: var(--col);
      margin-inline: auto;
    }

    /* ---- The counter ------------------------------------------------
       The whole point of the page. The number is set in the compressed
       gothic at the largest size the window's HEIGHT will carry, with the
       leading pulled in tight (.82) so a four-digit number and the word
       under it read as one block rather than two lines of text.

       main centres the block, so this padding is only here to keep it off
       the edges when the window is too short to spare any. */
    .hero {
      padding: clamp(0.5rem, 2vh, 1.5rem) 0;
      text-align: center;
    }

    .eyebrow {
      font-family: var(--font-label);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: clamp(0.7rem, 1.6vw, 0.9rem);
      color: var(--red);
      margin-bottom: clamp(1rem, 3vh, 2rem);
      /* The other half of the odometer's housing — see .count-unit. The
         overlap is only a few pixels at this end, and only at the sizes
         where the counter is largest, but it is the same overlap. */
      position: relative;
      z-index: 1;
      background: var(--black);
    }

    .count {
      font-family: var(--font-heading);
      font-weight: 800;
      text-transform: uppercase;
      /* Height sets the size. The number and the word beneath it come to
         about 1.45 times this, so 44vh spends roughly two thirds of the
         window on them and leaves the rest for the three lines around
         them — the fold ends up 95% full at most window shapes.

         The vw term is not a design constraint, it is the guard against
         the number running off the side, and it only ever engages when
         the window is far wider than it is tall or far narrower: a digit
         of a condensed face is about half its own size across, so a count
         of `--digits` of them needs that much of the 88vw column. The
         script keeps --digits in step; the 3 is what stands before it
         runs, and the day the count reaches four figures this is what
         stops it overrunning rather than someone having to notice. */
      font-size: clamp(3rem, min(44vh, calc(88vw / (var(--digits, 3) * 0.5))), 30rem);
      line-height: 0.82;
      letter-spacing: -0.01em;
      margin: 0;
      /* Tabular figures so the number doesn't reflow when it ticks over
         to a new digit width, and so it can't shift between fallback
         faces mid-render. */
      font-variant-numeric: tabular-nums;
      /* Establishes a block formatting context, which is what keeps the
         odometer's negative top margin below INSIDE this heading. Without
         it that margin collapses straight through the h1 — the number ends
         up in the right place either way, but by dragging the whole
         heading box 0.09em up into the eyebrow above it rather than by
         sitting where it says it sits, and it would come apart the moment
         anything gave .count a padding or a border. */
      display: flow-root;
    }

    /* ---- The odometer -----------------------------------------------
       One clipped window per digit, each holding a strip of faces that is
       translated to bring the right one into view. Every wheel rests
       squarely on a face — the count is a whole number of days and it is
       shown as one, so nothing sits half-turned between two digits. The
       wheels only ever move under the spin-in on load, or on the carry if
       a page is left open past midnight.

       #days carries this class whether or not the script runs. Before it
       does, the element holds the plain fallback number as a single flex
       item, which the centering and the height below place exactly where
       the odometer will land.

       The three numbers that describe the drum are set by the script,
       which measures the face actually in use — see the note there. The
       values here are the ones that are safe without measuring: a face
       pitch of a full 1em, which is roomy enough that no face in the
       stack can push a digit outside it, and the pair of negative margins
       that take the BLOCK back to the 0.82em line the number occupied as
       plain text, so nothing around it moves. They stand if the
       measurement can't be made. */
    .odo {
      display: flex;
      justify-content: center;
      height: var(--odo-pitch, 1em);
      margin-top: var(--odo-lead, -0.09em);
      margin-bottom: var(--odo-trail, -0.09em);
    }

    .odo-col { height: var(--odo-pitch, 1em); overflow: hidden; }

    .odo-strip {
      display: block;
      /* The resting turn is the second of the three, so this is where the
         script will park it. Set here as well so the first paint can't
         catch the strip at face 0. */
      transform: translate3d(0, -10em, 0);
      will-change: transform;
    }

    .odo-cell {
      display: block;
      height: var(--odo-pitch, 1em);
      line-height: var(--odo-pitch, 1em);
    }

    /* The measuring rig: one face, laid out in the real font at the real
       size but taken out of the flow and off the page, and a strut whose
       top edge lands exactly on the baseline the browser chose. */
    .odo-probe { position: absolute; visibility: hidden; }
    .odo-strut { display: inline-block; width: 0; height: 0; }

    /* This line and .eyebrow above are the odometer's housing, which is
       why they are painted rather than merely coloured.

       A wheel's window has to be a full 1em: the digit sits at a
       different height in the em box in every one of the fallback faces —
       far enough apart that a window cropped tight to one of them cuts
       the baseline off another — and 1em is the size that holds all of
       them. The block only gives the number 0.82em, though, so a face on
       its way past reaches about 0.09em beyond the window at each end,
       and the incoming digit was crossing the top of the word DAYS.
       Painting the two neighbours opaquely over it is what stops that:
       the aperture becomes the gap between them, and a digit leaving it
       slides out of sight behind the housing instead of over the type.
       Nothing here moves, so the block keeps the spacing it had when the
       number was plain text. */
    .count-unit {
      display: block;
      font-size: 0.42em;
      letter-spacing: 0.02em;
      color: var(--red);
      position: relative;
      z-index: 1;
      background: var(--black);
    }

    .statement {
      font-family: var(--font-heading);
      font-weight: 800;
      text-transform: uppercase;
      font-size: clamp(1.05rem, min(5vw, 6vh), 3.25rem);
      line-height: 0.9;
      letter-spacing: 0.005em;
      max-width: 20ch;
      margin: clamp(1.1rem, 3.2vh, 2.75rem) auto 0;
    }

    .since {
      font-family: var(--font-label);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: clamp(0.68rem, min(1.8vw, 2.1vh), 0.95rem);
      color: var(--dim);
      margin: clamp(0.9rem, 2.5vh, 2rem) auto 0;
      max-width: 44ch;
      line-height: 1.7;
    }

    /* ---- Footer -----------------------------------------------------
       Attribution carried over from osbornforsenate.com: the paid-for
       line, the Navy rank disclaimer, the mailing address and the
       copyright, in the site's own order and wording. */
    .footer {
      border-top: 2px solid var(--red);
      padding: clamp(2rem, 5vh, 3.5rem) 0 clamp(2.25rem, 6vh, 4rem);
      text-align: center;
    }

    .footer-mark {
      font-family: var(--font-heading);
      font-weight: 800;
      text-transform: uppercase;
      font-size: clamp(1.5rem, 4.5vw, 2.5rem);
      line-height: 0.9;
      letter-spacing: 0.01em;
      margin: 0 0 0.6em;
    }

    .footer-mark a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 2px solid var(--red);
      padding-bottom: 0.06em;
    }

    .footer-mark a:hover,
    .footer-mark a:focus-visible {
      color: var(--red);
    }

    /* The footer is now the mark plus this line and nothing else, so it
       ends here — no bottom margin to push dead space under it. */
    .paid-for {
      font-family: var(--font-label);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: clamp(0.75rem, 1.9vw, 0.95rem);
      margin: 0;
    }

    /* Below the host site's own 749px breakpoint the column tightens,
       and the statement is given a little more room to break. */
    @media (max-width: 749px) {
      :root { --col: 88vw; }
      /* Wide enough to keep "SINCE PETE RICKETTS" on one line — at 14ch
         it broke after "PETE" and the name split across lines. */
      .statement { max-width: 19ch; }
    }

    /* The counter animating in is decoration, not information — anyone
       who has asked for less motion just gets the number. */
    @media (prefers-reduced-motion: no-preference) {
      .hero > * {
        animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      .count { animation-delay: 0.06s; }
      .statement { animation-delay: 0.12s; }
      .since { animation-delay: 0.18s; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(0.5rem); }
      to   { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <main>
    <section class="hero wrap">
      <p class="eyebrow">Nebraska is still waiting</p>

      <!-- The number is rendered server-side-ish as a static fallback so
           the page says something true before the script runs; the boot
           script recomputes it from the date below on every load and
           replaces the text with the odometer's digit columns.

           role="img" plus a label is what keeps a screen reader out of the
           wheels: the strips hold 0123456789 twice over per column, and
           read literally that is what a reader would hear instead of the
           count. The label is the number, and .count-unit supplies the
           word after it. The script keeps the label in step. -->
      <!-- Not the h1, deliberately. The heading a crawler reads should say
           what the page is about, and this one says "479" — the number is
           the whole design but it is worth nothing as a heading, and it
           changes every day. The sentence under it carries the words
           someone would actually search for, so that is the h1, and this
           steps down to a div. Nothing about how either one looks changes:
           both are styled by class. -->
      <div class="count">
        <span class="odo" id="days" role="img" aria-label="479">479</span>
        <span class="count-unit">Days</span>
      </div>

      <h1 class="statement">Since Pete Ricketts held a town hall</h1>

      <p class="since">
        His last in-person town hall was in Scottsbluff on
        <time datetime="2025-04-25">April&nbsp;25,&nbsp;2025</time>.
      </p>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p class="footer-mark">
        <a href="https://osbornforsenate.com" rel="noopener">Osborn for Senate</a>
      </p>

      <p class="paid-for">Paid for by Osborn for Senate</p>
    </div>
  </footer>

  <script>
    // ---- The count -------------------------------------------------
    // The one number this site exists to show. Ricketts' last in-person
    // town hall: Scottsbluff, April 25, 2025.
    //
    // Both dates are floored to UTC midnight before subtracting, so the
    // result is a whole-day difference that can't be knocked off by one
    // by a DST boundary or by the visitor's own timezone offset. The
    // anchor is written as Y/M/D parts rather than parsed from a string:
    // "2025-04-25" would be read as UTC while new Date() is local, and
    // mixing the two is exactly how a counter ends up a day out.
    var LAST_TOWN_HALL = { year: 2025, month: 4, day: 25 };

    (function () {
      var el = document.getElementById('days');
      if (!el) return;

      var DAY_MS = 86400000;
      var FACES = 10;    // 0-9 on every wheel
      var REST = FACES;  // the resting turn is the second one, leaving a full turn of runway above it

      var anchor = Date.UTC(
        LAST_TOWN_HALL.year, LAST_TOWN_HALL.month - 1, LAST_TOWN_HALL.day
      );

      // The count: whole days, and only whole days.
      //
      // The wheels rest on a face rather than between two, so the day in
      // progress isn't carried as a fraction and the local day's own length
      // never comes into it. Both dates are floored to UTC midnight before
      // subtracting, which is what keeps the difference a whole number of
      // days that neither a DST boundary nor the visitor's timezone offset
      // can knock off by one.
      function elapsed() {
        var now = new Date();
        return Math.floor(
          (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - anchor) / DAY_MS
        );
      }

      // Where wheel `place` (the 10^place column) should sit for `value`:
      // squarely on its own digit, a whole number of faces from the top of
      // the strip. Every wheel is either on a face or travelling between
      // two under the spin's transition — never parked partway.
      function offsetFor(value, place) {
        return REST + Math.floor(value / Math.pow(10, place)) % FACES;
      }

      // ---- The drum --------------------------------------------------
      // How far apart the faces sit, and where the window sits on them.
      // These are the CSS defaults until the measurement below replaces
      // them: a 1em pitch and no correction, which is the arrangement
      // that is safe on a face nobody has looked at.
      var SLOT = 0.82;   // the line .count gives the number; the drum has to fit it
      var GUTTER = 1.18; // face pitch as a multiple of the digit's own height
      var pitch = 1, bias = 0;

      // Every face in the stack puts its digits at a different height in
      // the em box, and far enough apart that a drum cut close to one of
      // them clips another — Oswald's baseline alone sits a tenth of an
      // em below Arial Narrow's. The face the live site actually uses
      // comes from Typekit, on a domain this page can't be tested from,
      // so the drum is measured rather than assumed: one hidden face
      // gives the ink of a "0" and the baseline the browser really put it
      // on, and the pitch and window follow from those. Whatever the
      // face, the clearance above and below a resting digit then comes
      // out the same by construction and nothing can be clipped.
      //
      // All of it in em, so it holds at every size the clamp lands on and
      // a resize needs nothing. Done again if a webfont turns up late and
      // changes the answer.
      function measure() {
        var probe = document.createElement('span');
        probe.className = 'odo-cell odo-probe';
        probe.textContent = '0';
        var strut = document.createElement('i');
        strut.className = 'odo-strut';
        probe.appendChild(strut);
        el.appendChild(probe);

        var cs = getComputedStyle(probe);
        var size = parseFloat(cs.fontSize);
        var line = parseFloat(cs.lineHeight) / size;
        var baseline =
          (strut.getBoundingClientRect().top - probe.getBoundingClientRect().top) / size;

        var ink = null;
        try {
          var ctx = document.createElement('canvas').getContext('2d');
          ctx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
          var m = ctx.measureText('0');
          if (m && m.actualBoundingBoxAscent > 0) {
            // Kept as the ink's own reach above and below the baseline
            // rather than as offsets from the cell's top edge. Those
            // offsets would carry the probe's line height with them, and
            // the probe is laid out before --odo-pitch is set — so it
            // measures a 1em line box while the cells it stands in for
            // get a pitch-tall one, and every number derived from it
            // would be out by half the difference.
            ink = {
              ascent: m.actualBoundingBoxAscent / size,
              descent: m.actualBoundingBoxDescent / size
            };
          }
        } catch (e) { /* older browser: the CSS defaults stand */ }

        el.removeChild(probe);
        if (!ink || !(size > 0) || !(line > 0)) return false;

        // A line box's baseline sits at half its height plus a constant
        // the font decides, so one measurement gives the baseline at any
        // line height — including the 0.82 the number had as text, which
        // is the baseline the digits have to keep.
        var constant = baseline - line / 2;
        var height = ink.ascent + ink.descent;
        // Where the ink's middle falls relative to the baseline it sits on.
        // Negative for digits, and by most of half their height: they rise
        // well above the baseline and, apart from a round face's overshoot,
        // dip nothing below it. Both numbers below are placements of that
        // middle, and neither depends on the probe's line height any more.
        var centre = (ink.descent - ink.ascent) / 2;

        pitch = height * GUTTER;
        // Centre the ink in its window. A cell of this pitch puts its
        // baseline at pitch/2 + constant, so that plus `centre` is where
        // the ink's middle lands, and the shift is what takes it to the
        // middle of the window.
        bias = pitch / 2 - (pitch / 2 + constant + centre);
        // And place the window so the digits keep the baseline they had as
        // plain text on the 0.82em line: the resting ink is centred at
        // lead + pitch/2, which puts that baseline `centre` above it.
        var lead = (SLOT / 2 + constant) - (pitch / 2 - centre);

        el.style.setProperty('--odo-pitch', pitch + 'em');
        el.style.setProperty('--odo-lead', lead + 'em');
        el.style.setProperty('--odo-trail', (SLOT - pitch - lead) + 'em');
        return true;
      }

      var wheels = [];

      function build(columns) {
        el.textContent = '';
        wheels = [];
        for (var i = 0; i < columns; i++) {
          var col = document.createElement('span');
          col.className = 'odo-col';
          var strip = document.createElement('span');
          strip.className = 'odo-strip';
          // 0-9 twice over. The rest position lives in the second turn, so
          // there is a full turn of runway above it for the spin to come in
          // through. Nothing reaches past the second turn now that the
          // wheels park on whole faces — the highest offset is REST + 9 —
          // so a trailing face to carry onto would go unused.
          for (var f = 0; f < FACES * 2; f++) {
            var cell = document.createElement('span');
            cell.className = 'odo-cell';
            cell.textContent = String(f % FACES);
            strip.appendChild(cell);
          }
          col.appendChild(strip);
          el.appendChild(col);
          wheels.push(strip);
        }
      }

      // The transform that brings face `offset` into the window. Shared with
      // the spin, which needs the same positions as animation keyframes.
      function at(offset) {
        return 'translate3d(0,' + (bias - offset * pitch) + 'em,0)';
      }

      function park(strip, offset) {
        strip.style.transform = at(offset);
      }

      var title = '';

      function tick() {
        var value = elapsed();
        if (!(value > 0)) return;  // also catches NaN, leaving whatever stands

        var text = value.toLocaleString('en-US');
        var columns = String(value).length;

        // Rebuilt only when the count gains a digit — which on a page left
        // open means at a midnight, and otherwise only on the first pass.
        if (columns !== wheels.length) {
          build(columns);
          // How wide the number is allowed to be depends on how many digits
          // it has, and only the script knows that. See the note on .count:
          // this is what keeps a four-figure count off the side of the
          // window without anyone having to remember it.
          document.documentElement.style.setProperty('--digits', columns);
        }

        for (var i = 0; i < wheels.length; i++) {
          park(wheels[i], offsetFor(value, wheels.length - 1 - i));  // leftmost is the highest place
        }

        if (text !== title) {
          title = text;
          el.setAttribute('aria-label', text);
          document.title = text + ' days since Pete Ricketts held a town hall';
        }
      }

      // ---- The spin-in -----------------------------------------------
      // Slot machine. Every column spins on its own at the same flat speed,
      // and they come to rest one at a time from the left: a column keeps
      // spinning until the one to its left has landed, so the number arrives
      // a digit at a time, hundreds first. Nothing is geared to anything and
      // no column knows what the others read — the only thing passing
      // between them is when they are allowed to stop.
      //
      // A reel decelerates from the speed it was spinning at, so the
      // distance that takes is fixed before we know anything else. Rather
      // than fudge the landing to make it end on the right face, the spin is
      // simply held on for however much further it takes to reach a point
      // that distance short of the digit — under one extra turn, and
      // invisible against a reel already blurred. So the deceleration is
      // continuous out of the spin (no lurch as it starts to brake) and the
      // reel still stops dead on its face.
      //
      // Decoration, so anyone who has asked for less motion simply gets the
      // number.
      var REEL_RATE = 80;      // faces a second while spinning
      var FIRST_STOP = 0.2;    // before the leftmost reel starts to land
      var LAND_SECONDS = 0.5;  // for a reel to come to rest once it starts
      var HOLD = 0.10;         // beat between one reel landing and the next braking

      function spin() {
        if (!window.requestAnimationFrame) return;

        var value = elapsed();
        var columns = wheels.length;
        // Eased out of, so a brake covers a third of what flat out would.
        var brake = REEL_RATE * LAND_SECONDS / 3;
        var reels = [];
        var earliest = FIRST_STOP;
        var last = 0;

        for (var i = 0; i < columns; i++) {
          var digit = Math.floor(value / Math.pow(10, columns - 1 - i)) % FACES;
          // Where this reel is standing when the spin starts. Anywhere at
          // all, rather than a face picked out of the ten: reels that all
          // start ON a face keep changing digit in step with each other for
          // the whole spin, however different the faces they started on
          // were, and three columns flicking over together read as one tall
          // reel. Landing on a whole face is arranged below, so the start
          // doesn't have to be one.
          var phase = Math.random() * FACES;
          var enter = phase + REEL_RATE * earliest;   // where the reel is when it may brake
          // The next point at or after that which is `brake` short of the
          // digit, so that braking from there lands on it.
          var from = enter + (((digit - brake - enter) % FACES) + FACES) % FACES;
          var begin = (from - phase) / REEL_RATE;
          reels.push({ phase: phase, from: from, begin: begin });
          last = Math.max(last, begin + LAND_SECONDS);
          // The next reel along may not start braking until this one is down.
          earliest = begin + LAND_SECONDS + HOLD;
        }

        var start = 0;
        requestAnimationFrame(function frame(now) {
          if (!start) start = now;
          var t = (now - start) / 1000;

          for (var j = 0; j < columns; j++) {
            var reel = reels[j];
            var pos;
            if (t <= reel.begin) {
              pos = reel.phase + REEL_RATE * t;        // still spinning
            } else {
              var s = Math.min(1, (t - reel.begin) / LAND_SECONDS);
              pos = reel.from + brake * (1 - Math.pow(1 - s, 3));
            }
            park(wheels[j], REST + pos % FACES);
          }

          if (t < last) requestAnimationFrame(frame);
          else tick();   // land on the clock, in case a midnight passed mid-spin
        });
      }

      measure();
      tick();
      if (!wheels.length) return;  // count not positive yet; fallback text stands

      // A webfont arriving after this ran changes every number the drum
      // was built from, so it gets measured again and the wheels re-park
      // on the new one. On this domain the kit is not served and nothing
      // comes of it; on osbornforsenate.com it is the only pass that sees
      // the real face.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          if (measure()) tick();
        });
      }

      if (!window.matchMedia ||
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        spin();
      }

      // Nothing changes between midnights now, so almost every one of these
      // is a no-op — the point is the one that isn't. Half a minute is what
      // bounds how long a page left open can sit on yesterday's number; the
      // wheel snaps to the new digit on that pass rather than rolling to it,
      // which is a carry nobody is watching at midnight.
      setInterval(tick, 30000);
      // A backgrounded tab gets its timers throttled to a crawl, so a tab
      // brought back after hours re-reads the clock instead of trusting
      // whatever the last throttled tick left behind.
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) tick();
      });
    })();
  </script>

</body>
</html>
